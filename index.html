<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` es lo que hace que existan las variables
      `env(safe-area-inset-*)`: sin esto, el botón «Listo» queda debajo de la barra
      de gestos en un iPhone. El zoom nunca se deshabilita.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171633" />
    <meta name="description" content="No tenés que ordenar todo, solo lo siguiente." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/iconos/icono-192.png" />
    <link rel="apple-touch-icon" href="/iconos/icono-192.png" />
    <!--
      Cómo se ve el enlace al compartirlo por WhatsApp, Telegram o redes. Las
      direcciones tienen que ser absolutas: si la app se muda a un dominio propio,
      se cambian acá y en `public/robots.txt`.
    -->
    <link rel="canonical" href="https://por-donde-empiezo.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Por dónde empiezo" />
    <meta property="og:title" content="Por dónde empiezo" />
    <meta property="og:description" content="No tenés que ordenar todo, solo lo siguiente. Elegí qué ordenar, decí cuánto tiempo tenés y la app te dice por dónde arrancar. Gratis, sin cuenta y sin publicidad." />
    <meta property="og:url" content="https://por-donde-empiezo.vercel.app/" />
    <meta property="og:image" content="https://por-donde-empiezo.vercel.app/iconos/icono-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="El ícono de Por dónde empiezo" />
    <meta name="twitter:card" content="summary" />
    <title>Por dónde empiezo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
